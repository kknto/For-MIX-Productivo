services:
  - type: web
    name: formix-preprod
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: formix-preprod-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: 1
      - key: FORMIX_ALLOW_DEFAULT_USERS
        value: 0
      - key: FORMIX_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: FORMIX_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: America/Cancun
      - key: FORMIX_ALLOWED_ORIGINS
        value: https://formix-preprod.onrender.com
      - key: APP_SECRET_KEY
        generateValue: true
      - key: TZ
        value: America/Cancun

databases:
  - name: formix-preprod-db
    plan: free
    databaseName: formix_preprod
    user: formix_preprod
